name: Build GitHub package

on:
  push:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - name: Assemble package branch
        run: |
          package_dir="$RUNNER_TEMP/currency-kit-package"
          mkdir -p "$package_dir/dist"
          cp -R dist/. "$package_dir/dist/"
          cp README.md "$package_dir/README.md"
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const source = JSON.parse(readFileSync("package.json", "utf8"));
            const fields = ["name", "version", "description", "private", "type", "main", "module", "files", "sideEffects", "types", "exports", "dependencies"];
            const manifest = Object.fromEntries(fields.filter((field) => field in source).map((field) => [field, source[field]]));
            writeFileSync(process.env.PACKAGE_DIR + "/package.json", JSON.stringify(manifest, null, 2) + "\n");
          '
        env:
          PACKAGE_DIR: ${{ runner.temp }}/currency-kit-package
      - name: Push package branch
        run: |
          cd "$RUNNER_TEMP/currency-kit-package"
          git init --initial-branch=package-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json README.md dist
          git commit -m "Build package from ${GITHUB_SHA}"
          git push --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/package-dist
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: "AUTHORIZATION: bearer ${{ github.token }}"
